name: Build

# Reproducibility self-test: builds the debug APKs (per-ABI splits plus the
# universal one - see app/build.gradle's splits.abi) twice, on two
# independent GitHub-hosted runners, and fails the workflow if any of the
# resulting APKs are not byte-for-byte identical between the two runs. Both
# jobs sign with the same fixed, committed app/debug.keystore (see app/
# build.gradle's signingConfigs.debug) rather than AGP's auto-generated
# per-machine one, which is what makes a whole-file hash comparison
# meaningful instead of failing on the signing block alone. This is a
# pre-submission sanity check only; it does not replace F-Droid's own
# reproducible-build verification against the fdroiddata metadata.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  code-quality:
    name: Code quality (Spotless + Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build

      - name: Check formatting (Spotless)
        run: ./gradlew --no-daemon spotlessCheck

      - name: Android Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html

  error-prone:
    # Opt-in (-Perrorprone, see the root build.gradle), and the only job in which warnings are
    # errors: javac's lints and Error Prone's findings fail the build in the library modules on
    # either JDK, in :desktop only on 25 (see there). 25 is also what the desktop legs of
    # desktop.yml and release.yml build with, and its javac has lint checks 21 lacks.
    name: Error Prone (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build
        with:
          java-version: ${{ matrix.java }}

      - name: Error Prone
        run: ./gradlew --no-daemon -Perrorprone :pegasus-core:compileTestJava :chessnut-core:compileTestJava :core:compileTestJava :desktop:compileTestJava

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon :pegasus-core:test :chessnut-core:test :app:testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest
            pegasus-core/build/test-results/test
            chessnut-core/build/test-results/test
            pegasus-core/build/reports/jacoco/test
            chessnut-core/build/reports/jacoco/test

  instrumented-tests:
    name: Instrumented tests (emulator)
    # StockfishEngine (real subprocess + Handler/Looper) and BoardView (real
    # View measure/layout/touch, resources, BitmapFactory) can't be tested
    # on the plain JVM; app/src/androidTest runs them on an emulator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            app/build/outputs/androidTest-results
            app/build/reports/androidTests

  build-a:
    name: Build A (independent runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build

      - name: Build debug APKs
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-a
          path: app/build/outputs/apk/debug/*.apk

  build-b:
    name: Build B (independent runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-build

      - name: Build debug APKs
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-b
          path: app/build/outputs/apk/debug/*.apk

  compare:
    name: Compare build hashes
    needs: [build-a, build-b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug-a
          path: build-a

      - uses: actions/download-artifact@v4
        with:
          name: app-debug-b
          path: build-b

      - name: Compare SHA-256 hashes
        run: |
          shopt -s nullglob
          apks=(build-a/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No APKs found in build A's artifact."
            exit 1
          fi
          fail=0
          for apk_a in "${apks[@]}"; do
            name=$(basename "$apk_a")
            apk_b="build-b/$name"
            if [ ! -f "$apk_b" ]; then
              echo "::error::$name was produced by build A but not build B."
              fail=1
              continue
            fi
            hash_a=$(sha256sum "$apk_a" | cut -d' ' -f1)
            hash_b=$(sha256sum "$apk_b" | cut -d' ' -f1)
            echo "$name: A=$hash_a B=$hash_b"
            if [ "$hash_a" != "$hash_b" ]; then
              echo "::error::$name is not reproducible: hashes differ between two independent runners."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "All APKs are bit-identical across independent runners."

      - name: Upload verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-verified
          path: build-a/*.apk
