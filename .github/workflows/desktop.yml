name: Desktop

# Builds and packages the JavaFX desktop app (see desktop/) across OSes and
# architectures. Unlike build.yml's Android reproducibility check, this is
# plain build/package verification - desktop has no reproducible-build
# requirement.
#
# macos-latest (Apple Silicon) mirrors what has actually been built and run
# locally throughout desktop/'s development. macos-15-intel and
# ubuntu-24.04-arm cover the other arch on each OS at no code cost -
# desktop/stockfish.gradle's sfArch already branches on the host arch, not
# just the OS. Every leg besides arm64 Mac (Linux x86-64/arm64, and
# especially Windows) is effectively a first run: desktop/stockfish.gradle's
# host-Stockfish build has native-toolchain branches for all of them, but
# only arm64 Mac had a real machine to verify against before this workflow
# existed - see that file's header comment. Treat early failures on the
# unverified runners as expected teething, not a sign anything else is
# wrong.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Build & package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          # ubuntu-latest is x86-64 only; same idea as macos-15-intel below
          # (desktop/stockfish.gradle's sfArch already branches on the host
          # arch for Linux too - armv8 vs. x86-64 - no code change needed).
          - os: ubuntu-24.04-arm
            shell: bash
          - os: macos-latest
            shell: bash
          # macos-latest is Apple Silicon (arm64); this covers Intel Macs
          # (desktop/stockfish.gradle's sfArch already branches on
          # isArm/os.arch, so no code change was needed - just the runner).
          # Note this leg also silently picks a different ONNX Runtime JVM
          # artifact: ext.onnxruntimeVersion in the root build.gradle
          # resolves to 1.16.3 on Intel macOS hosts (last version with
          # osx-x64 natives that load on macOS 12), 1.29.0 everywhere else -
          # the version actually chosen is logged at configuration time.
          - os: macos-15-intel
            shell: bash
          - os: windows-latest
            # Stockfish's Makefile needs a real MinGW toolchain (COMP=mingw)
            # to build a native Windows binary - the default windows-latest
            # runner has no C/C++ compiler at all, so one is installed below
            # via MSYS2 and every subsequent command runs inside its shell
            # so make/g++/xz resolve on PATH.
            shell: 'msys2 {0}'
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # jpackage bundles its app-image runtime from whichever JDK runs
          # it (System.getProperty('java.home') in packaging.gradle), and
          # javafx 24.0.2's classes are compiled to class-file version 66
          # (Java 22) - a JDK 21 runtime can't load them at all
          # (UnsupportedClassVersionError at launch), even though the CI
          # build itself succeeds since packaging never loads the classes.
          #
          # 25 (current LTS), not 22: on Windows the JDK ships its own copy
          # of the MSVC runtime (msvcp140.dll etc.) in bin/, and the loader
          # takes that one over System32's. ONNX Runtime's onnxruntime.dll
          # (1.21 and later) is built against a newer MSVC runtime than the
          # one in Temurin 22 (whose last build is 22.0.2, July 2024), so
          # it fails to initialize under that JDK - "A dynamic link library
          # (DLL) initialization routine failed", i.e. Maia can't start.
          # That applies to the jpackaged runtime image just the same, so
          # this is about the shipped MSI, not just :desktop:test. See
          # https://github.com/microsoft/onnxruntime/issues/24287 - the
          # maintainers' answer is "use a JDK compiled against a newer VC
          # redist", which any currently maintained release is.
          java-version: "25"

      - name: Set up MinGW toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-toolchain make xz
          path-type: inherit

      # MSVC + C++/WinRT, not MinGW, for the Pegasus BLE bridge
      # (pegasus-ble-windows.gradle) - see that file's header comment for
      # why. This action exports cl.exe/cppwinrt.exe's environment via
      # GITHUB_ENV/GITHUB_PATH, which later steps pick up regardless of
      # their own shell (including the msys2 shell every step in this job
      # defaults to, set up above with path-type: inherit specifically so
      # Windows-native PATH entries like these remain usable from it).
      - name: Set up MSVC toolchain (Windows, Pegasus BLE bridge)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Two steps, not one: choco updates the machine-level WIX env var, which
      # only a freshly spawned process (i.e. the next step) picks up - not
      # this same install step's own already-running shell.
      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Add WiX Toolset to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Join-Path $env:WIX 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential xz-utils fakeroot

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install xz

      # :desktop:test includes the Maia golden tests (MaiaEngineGoldenTest,
      # MaiaEngineSmokeTest): a real ONNX Runtime forward pass over the
      # bundled networks, checked against lc0's own output. Running it on
      # every leg is what verifies the per-OS/arch onnxruntime natives
      # (including the 1.16.3 fallback on Intel macOS, see the matrix
      # comment above) actually load and agree - not just that they package.
      # It also triggers buildStockfishHost (via processResources), which
      # the jpackage step below then finds up to date.
      - name: Run core and desktop unit tests
        run: ./gradlew --no-daemon :core:test :desktop:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results-${{ matrix.os }}
          path: |
            core/build/test-results/test
            desktop/build/test-results/test

      - name: Build desktop DEB (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon :desktop:jpackageDeb

      - name: Build desktop MSI (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew --no-daemon :desktop:jpackageMsi

      # DMG, not the raw app-image, on macOS - see packaging.gradle's file
      # header for why the app-image doesn't survive an artifact round trip.
      - name: Build desktop DMG (macOS)
        if: runner.os == 'macOS'
        run: ./gradlew --no-daemon :desktop:jpackageDmg

      - name: Upload DEB (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: moveapiece-desktop-${{ matrix.os }}
          path: desktop/build/jpackage/*.deb
          if-no-files-found: warn

      - name: Upload MSI (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: moveapiece-desktop-${{ matrix.os }}
          path: desktop/build/jpackage/*.msi
          if-no-files-found: warn

      - name: Upload DMG (macOS)
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: moveapiece-desktop-${{ matrix.os }}
          path: desktop/build/jpackage/*.dmg
          if-no-files-found: warn
