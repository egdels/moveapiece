name: Release

# Triggered by pushing a version tag (v1.0.0, v1.0.0-rc1, ...), not by
# creating a GitHub Release first - this job creates the Release itself.
# Builds release APKs signed with the real release key and publishes them
# as a GitHub Release for that tag: one per ABI (see app/build.gradle's
# splits.abi) plus a universal one for a single no-thinking-required
# download. Unlike build.yml's debug builds (signed with the committed,
# non-secret app/debug.keystore purely for reproducibility testing), this
# needs the actual signing identity from repository secrets. F-Droid does
# not use this workflow: it builds and signs from source itself, picking
# up the per-ABI splits via its own packaging metadata.
#
# A tag with a "-" suffix (e.g. "-rc1", "-beta1") is published as a
# pre-release; a plain "vX.Y.Z" tag is a full release.

on:
  push:
    tags:
      - 'v*'

env:
  NDK_VERSION: "28.0.13004108"
  BUILD_TOOLS_VERSION: "36.1.0"
  PLATFORM_VERSION: "android-36"

permissions:
  contents: write

jobs:
  build-and-sign:
    name: Build & sign release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install pinned SDK components
        run: sdkmanager --install "platforms;${PLATFORM_VERSION}" "build-tools;${BUILD_TOOLS_VERSION}" "ndk;${NDK_VERSION}"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Create the GitHub Release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          extra_args=(--title "$TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            extra_args+=(--prerelease)
          fi
          gh release create "$TAG" app/build/outputs/apk/release/*.apk "${extra_args[@]}"
