plugins {
    id 'com.android.application'
}

// Release signing comes from CI secrets (see .github/workflows/release.yml),
// never from local defaults - unset locally, so a plain `assembleRelease`
// outside that workflow builds an unsigned APK instead of failing.
def releaseKeystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
def releaseKeyAlias = System.getenv("SIGNING_KEY_ALIAS")
def releaseKeyPassword = System.getenv("SIGNING_KEY_PASSWORD")
def releaseStorePassword = System.getenv("SIGNING_STORE_PASSWORD")
def hasReleaseSigning = releaseKeystorePath && releaseKeyAlias && releaseKeyPassword && releaseStorePassword

// Derives versionCode from versionName instead of maintaining two numbers
// by hand: "4.6.2" -> 4*10000 + 6*100 + 2 = 40602. Missing components (e.g.
// a two-part "4.6") count as 0. Each component must stay below 100 (or the
// major below 100 too) for this to not overflow into the next one - fine
// for this project's versioning.
def (major, minor, patch) = (project.appVersion as String).tokenize('.').collect { it as int } + [0, 0, 0]
def baseVersionCode = major * 10000 + minor * 100 + patch

android {
    namespace 'de.schliweb.moveapiece'
    compileSdk 36
    // Reproducibility requirement: pin build-tools explicitly, never let
    // AGP pick an implicit default that could differ between machines/CI
    // depending on what's installed.
    buildToolsVersion "36.1.0"
    ndkVersion "28.0.13004108"

    defaultConfig {
        applicationId "de.schliweb.moveapiece"
        // Kept at 26 (not lowered to 24) in anticipation of re-adding physical
        // DGT Pegasus board support (BLE) once the manufacturer has responded;
        // that integration's transport needs the modern BLE scan APIs, which
        // require API 26+.
        minSdk 26
        targetSdk 36
        // Shared with the desktop app's --app-version (see packaging.gradle);
        // the actual value lives in the root gradle.properties. versionCode
        // is derived from it above, not maintained separately.
        versionCode baseVersionCode
        versionName project.appVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Only the ABIs we actually build Stockfish for (see stockfish.gradle).
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    // Per-ABI split APKs: F-Droid has no first-class support for a single
    // build producing several per-ABI outputs (unlike Play's multi-APK), so
    // its convention is one shared recipe whose per-ABI outputs are each
    // declared as a separate packaging-metadata build, pinned to a distinct
    // versionCode (see the androidComponents block below) so the client
    // always resolves the one matching the device's ABI. universalApk stays
    // on too, for a single no-thinking-required download - e.g. the fat
    // APK release.yml attaches to a GitHub Release.
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk true
        }
    }

    // Reproducibility requirement: AGP auto-generates ~/.android/debug.keystore
    // per machine (with a random key) if none exists, so two otherwise-identical
    // CI runners produce debug APKs that differ in their signing block alone.
    // This fixed, committed keystore (not sensitive - debug-only, never used for
    // release signing) makes the signature identical everywhere, which is what
    // lets build.yml's build-a/build-b hash comparison actually work.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Deterministic-build hygiene: strip VCS metadata so the APK does not
            // depend on checkout details (dirty state, remote URL, etc.) that could
            // differ between our CI and the F-Droid build server.
            vcsInfo {
                include false
            }
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            signingConfig signingConfigs.debug
            vcsInfo {
                include false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    // Native Stockfish binary is built by a dedicated task (see stockfish.gradle)
    // and placed directly under src/main/jniLibs/<abi>/libstockfish.so, packaged
    // like a normal native library so Android grants it execute permission.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        jniLibs {
            // Reproducibility requirement: do not let Gradle strip native
            // libraries, since re-stripping is not guaranteed to be
            // byte-for-byte deterministic across toolchain/host differences.
            useLegacyPackaging = true
        }
        doNotStrip '**/*.so'
    }

    dependenciesInfo {
        // Do not embed the Play Store signing/dependency block; irrelevant
        // outside Play and it is one more non-essential source of variance.
        includeInApk = false
        includeInBundle = false
    }

    lint {
        abortOnError = true
    }
}

// Assigns each ABI split's versionCode as baseVersionCode*10 + abiCode, so a
// device always resolves to the split matching its own ABI, and any future
// version bump (baseVersionCode strictly increasing) still outranks every
// split of every older version, since abiCode always stays a single digit.
// The universal APK has no ABI filter, so it doesn't match any abiCodes
// entry and is left at baseVersionCode unchanged, same as AGP's default.
// "x86" has no entry in stockfish.gradle's abiConfigs (nothing builds a
// 32-bit x86 binary) and isn't in splits.abi's include list above - kept in
// this map only so the code->ABI ordering matches F-Droid's documented
// recommendation (armeabi-v7a < arm64-v8a < x86 < x86_64).
def abiCodes = [
        "armeabi-v7a": 1,
        "arm64-v8a" : 2,
        "x86"       : 3,
        "x86_64"    : 4
]

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def abi = output.filters.find {
                it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI
            }?.identifier
            def abiCode = abiCodes[abi]
            if (abiCode != null) {
                output.versionCode.set(baseVersionCode * 10 + abiCode)
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.github.bhlangonijr:chesslib:1.3.7'
    // Platform-agnostic chess/engine/opening-trainer logic shared with the
    // desktop app; see :core and its build.gradle.
    implementation project(':core')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

apply from: 'stockfish.gradle'
