plugins {
    //id 'com.android.application' version '9.3.1' apply false
    id 'com.android.application' version '9.1.0' apply false
    id 'com.diffplug.spotless' version '8.10.1' apply false
    id 'net.ltgt.errorprone' version '4.2.0' apply false
}

// ONNX Runtime JVM artifact version shared by :core (compileOnly + tests) and :desktop (runtime).
// Chosen per build host, because the `onnxruntime` natives Microsoft ships are not equally usable
// everywhere:
//  - Intel Mac (macOS on x86_64): 1.16.3. Microsoft dropped osx-x64 natives from 1.24.0 onward,
//    and 1.17.0+ is built with a macOS 13.3 deployment target (C++20, e.g. std::to_chars(double)),
//    so it fails to dlopen on macOS 12 with "Symbol not found: __ZNSt3__18to_charsEPcS0_d"
//    (https://github.com/microsoft/onnxruntime/issues/21033). 1.16.3 is the last version that runs
//    Maia on an Intel Mac, including macOS 12.
//  - Everything else (Apple Silicon, Linux, Windows - i.e. all other CI runners in
//    .github/workflows/desktop.yml): the current release, kept in step with the
//    onnxruntime-android version in :app/build.gradle.
// The Java API is identical across both versions as far as MaiaEngine uses it.
ext {
    def hostOs = System.getProperty('os.name').toLowerCase()
    def hostArch = System.getProperty('os.arch')
    def isIntelMac = hostOs.contains('mac') && (hostArch == 'x86_64' || hostArch == 'amd64')
    onnxruntimeVersion = isIntelMac ? '1.16.3' : '1.29.0'
    // Logged so CI runs (.github/workflows/desktop.yml, release.yml) show which version a leg got.
    logger.lifecycle("ONNX Runtime JVM artifact: ${onnxruntimeVersion} (host ${hostOs}/${hostArch})")
}

subprojects {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            target 'src/**/*.java'
            googleJavaFormat('1.31.0').aosp()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
            licenseHeaderFile(rootProject.file('config/spotless/license-header.txt'))
        }
    }

    // CI only has the console log at hand (the XML reports are artifacts
    // behind a login), so a failing test must print its full stack trace
    // there rather than Gradle's default one-line "AssertionError at X:123".
    tasks.withType(Test).configureEach {
        testLogging {
            events 'failed'
            exceptionFormat 'full'
        }
    }
}

// The plain-Java library modules compile with every javac lint enabled and warnings as errors.
// :desktop and :app are left out: JavaFX 24 class files (version 66) and the Android toolchain
// produce warnings of their own that these modules cannot fix.
configure(subprojects.findAll { it.name in ['pegasus-core', 'chessnut-core', 'core'] }) {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:all', '-Werror']
    }
}

// Error Prone is opt-in (-Perrorprone), so that release builds - F-Droid's in particular - compile
// with plain javac and nothing else on the processor path. CI's code-quality job passes the flag.
// Its warnings fail the build in the library modules through -Werror above; in :desktop they are
// only reported.
if (project.hasProperty('errorprone')) {
    configure(subprojects.findAll { it.name in ['pegasus-core', 'chessnut-core', 'core', 'desktop'] }) {
        plugins.withId('java') {
            apply plugin: 'net.ltgt.errorprone'
            dependencies {
                errorprone 'com.google.errorprone:error_prone_core:2.48.0'
            }
            // Forked, because the daemon only carries the javac exports Spotless needs (see
            // gradle.properties) and the plugin then wrongly assumes it can run in-process. The
            // -XD flag is required by Error Prone on JDK 21; plugin 4.2.0 does not add it.
            tasks.withType(JavaCompile).configureEach {
                options.fork = true
                // :desktop's JavaFX class-file warnings alone would fill javac's default limit of 100.
                options.compilerArgs += ['-Xmaxwarns', '1000']
                options.errorprone {
                    // Pure style suggestions (newer syntax, Javadoc summaries) and two checks that do
                    // not fit here: StringSplitter recommends Guava, and EnumOrdinal objects to
                    // chesslib's File/Rank ordinals, which are their board coordinates.
                    disable('StatementSwitchToExpressionSwitch', 'PatternMatchingInstanceof',
                            'StringConcatToTextBlock', 'MissingSummary', 'StringSplitter',
                            'EnumOrdinal')
                }
                options.compilerArgs += ['-XDaddTypeAnnotationsToSymbol=true']
            }
        }
    }
}

// Coverage of the library modules' own unit tests, written next to every test run as
// build/reports/jacoco/test (HTML and XML). A report only; no threshold fails the build.
configure(subprojects.findAll { it.name in ['pegasus-core', 'chessnut-core', 'core'] }) {
    plugins.withId('java') {
        apply plugin: 'jacoco'
        jacoco {
            toolVersion = '0.8.14'
        }
        tasks.named('test') {
            finalizedBy tasks.named('jacocoTestReport')
        }
        tasks.named('jacocoTestReport') {
            dependsOn tasks.named('test')
            reports {
                xml.required = true
                html.required = true
            }
        }
    }
}
