plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'com.github.bhlangonijr:chesslib:1.3.7'
    // MaiaEngine's ONNX Runtime dependency (MIT-licensed, official Microsoft
    // package) - runs identically on desktop JVM and Android, unlike
    // Stockfish's per-platform native process, so it lives here in :core
    // rather than being split across :app/:desktop like stockfish.gradle.
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.29.0'

    testImplementation 'junit:junit:4.13.2'
    // Cross-checks ChessGame's FEN output against pegasus-core's own FEN
    // parser (see ChessGameTest#toFen_isParsableByPegasusCoreChessPosition);
    // test-only, :core has no runtime dependency on the physical-board module.
    testImplementation project(':pegasus-core')
}
