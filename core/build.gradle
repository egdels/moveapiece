plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'com.github.bhlangonijr:chesslib:1.3.7'
    // MaiaEngine only needs the ai.onnxruntime.* API surface to compile here - compileOnly, not
    // implementation, because desktop and Android need genuinely different artifacts at runtime
    // (desktop JVM natives vs. Android AAR natives for arm64-v8a/armeabi-v7a/x86_64), both MIT and
    // both published by Microsoft under the same ai.onnxruntime package. An implementation
    // dependency here would leak the desktop JVM jar's useless-on-Android native binaries onto
    // :app's runtime classpath (and duplicate-class with whichever artifact :app itself declares).
    // Each platform module supplies its own matching artifact instead - see :desktop/build.gradle
    // (onnxruntime) and :app/build.gradle (onnxruntime-android).
    //
    // The version is chosen per build host in the root build.gradle (ext.onnxruntimeVersion):
    // Intel Macs need the old 1.16.3, every other host gets the current release - see the
    // comment there. onnxruntime-android is unaffected (still ships x86_64 alongside
    // arm64-v8a/armeabi-v7a) and stays on the latest release in :app/build.gradle.
    compileOnly "com.microsoft.onnxruntime:onnxruntime:${rootProject.ext.onnxruntimeVersion}"

    testImplementation 'junit:junit:4.13.2'
    // MaiaEngine's own unit tests (MaiaMoveIndexerTest et al.) run on this module's local JVM, same
    // platform as :desktop - the desktop JVM artifact is the correct runtime here regardless of
    // which platform's UI is being worked on.
    testImplementation "com.microsoft.onnxruntime:onnxruntime:${rootProject.ext.onnxruntimeVersion}"
    // Cross-checks ChessGame's FEN output against pegasus-core's own FEN
    // parser (see ChessGameTest#toFen_isParsableByPegasusCoreChessPosition);
    // test-only, :core has no runtime dependency on the physical-board module.
    testImplementation project(':pegasus-core')
}
