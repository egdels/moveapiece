plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'com.github.bhlangonijr:chesslib:1.3.7'

    testImplementation 'junit:junit:4.13.2'
    // Cross-checks ChessGame's FEN output against pegasus-core's own FEN
    // parser (see ChessGameTest#toFen_isParsableByPegasusCoreChessPosition);
    // test-only, :core has no runtime dependency on the physical-board module.
    testImplementation project(':pegasus-core')
}
