plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

javafx {
    // 24.0.2, not 21.0.2: JavaFX only started publishing linux-aarch64
    // natives on Maven Central from 22.0.1 onward, so 21.0.2 fails to
    // resolve entirely on ARM64 Linux (desktop.yml's ubuntu-24.04-arm leg).
    version = '24.0.2'
    modules = ['javafx.controls', 'javafx.media']
}

application {
    mainClass = 'de.schliweb.moveapiece.desktop.DesktopApp'
}

// javafx-controls 24.0.2 is compiled to class-file version 66 (Java 22).
// The javafx plugin makes `run` launch via --module-path, and the module
// system enforces the module descriptor's version strictly, so `run` fails
// under JDK <22 with "Unsupported major.minor version 66.0" even before
// any class gets loaded. Pin just this task to a JDK new enough for that;
// jpackageAppImage doesn't need this pin since it packages in classpath
// mode (see packaging.gradle) and never touches the module path - it just
// needs *a* JDK >=22 to build with, which desktop.yml's setup-java provides.
tasks.named('run', JavaExec) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

dependencies {
    implementation project(':core')
    implementation project(':pegasus-core')
    implementation 'com.github.bhlangonijr:chesslib:1.3.7'
    // Linux only (see LinuxPegasusBleTransport's Javadoc) - unlike the
    // macOS/Windows transports, BlueZ's whole D-Bus API is reachable from
    // pure Java, so no native bridge is needed there at all. Both are
    // MIT-licensed (unlike SimpleBLE's BUSL-1.1, see the physical board
    // section of README.md) and harmless to include unconditionally: the
    // classes simply go unused on other OSes, same as chesslib etc. above.
    implementation 'com.github.hypfvieh:bluez-dbus:0.3.5'
    // Pure-Java (java.net.UnixDomainSocketAddress, JDK 16+) unix-socket
    // transport for dbus-java - no native/JNR/JNI component at all, unlike
    // the jnr-unixsocket/junixsocket alternatives bluez-dbus also supports.
    implementation 'com.github.hypfvieh:dbus-java-transport-native-unixsocket:5.2.0'

    testImplementation 'junit:junit:4.13.2'
}

apply from: 'stockfish.gradle'
apply from: 'pegasus-ble-macos.gradle'
apply from: 'pegasus-ble-windows.gradle'
apply from: 'packaging.gradle'
