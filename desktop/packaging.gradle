/*
 * Packages the desktop app as a native, double-clickable application image
 * via the JDK's own `jpackage` tool - no extra Gradle plugin, driven
 * directly with ProcessBuilder the same way stockfish.gradle drives `make`
 * (see that file's header comment for why: Gradle 9's task execution model
 * disallows calling back into the Project instance from inside doLast).
 *
 * The app icon is the Android app's own launcher icon (same artwork as
 * app/src/main/res/mipmap/ic_launcher.png; src/main/resources/.../icon.png
 * is a copy of the Play Store listing image at
 * fastlane/metadata/android/de-DE/images/icon.png, 512x512 - a resolution
 * actually usable for a desktop icon, and also used at runtime for
 * DesktopApp's window/dock icon), converted here into the per-OS format
 * jpackage needs (.icns/.ico/.png). Only the macOS path has
 * actually been run and verified in this project so far; the Windows/Linux
 * icon generation is included for when this build runs on those hosts, but
 * is unverified - see the analogous note in desktop/stockfish.gradle about
 * only the macOS Stockfish host build being verified.
 *
 * jpackageAppImage (`--type app-image`) is the plain, no-prerequisites
 * output - a normal, launchable .app/.exe/binary folder, not a polished
 * installer, useful for local testing without dpkg-deb/WiX installed. The
 * actual release artifacts (release.yml) use a real installer format per
 * OS instead - none of these are code-signed (no signing/notarization
 * credentials configured for this project), so first launch/install shows
 * the OS's usual "unidentified developer" style warning:
 *
 *  - macOS: jpackageDmg (`--type dmg`). jpackage ad-hoc-signs the app
 *    bundle either way (arm64 Macs refuse to run an entirely unsigned
 *    binary), and that signature embeds a hash manifest of every file in
 *    the bundle. A raw app-image directory is a poor way to ship that: CI
 *    would upload it by zipping the directory tree, and unzipping it again
 *    on the receiving end doesn't reliably reproduce the exact
 *    bytes/permissions the manifest was hashed against, so the seal
 *    silently breaks - macOS then refuses to launch it at all ("app is
 *    damaged"), which not even a user override can bypass. A DMG is a raw
 *    disk-image file, byte-identical after download; mounting it never
 *    touches the seal.
 *  - Linux: jpackageDeb (`--type deb`). Needs `dpkg-deb` (present on any
 *    Debian/Ubuntu host) and `fakeroot`.
 *  - Windows: jpackageMsi (`--type msi`). Needs the WiX Toolset (v3;
 *    candle.exe/light.exe) on PATH - not bundled with the JDK.
 */

def os = org.gradle.internal.os.OperatingSystem.current()
def appName = 'MoveAPiece'
// Shared with the Android app's versionName (see app/build.gradle); the
// actual value lives in the root gradle.properties. macOS requires the
// first component of --app-version to be a positive integer (it becomes
// CFBundleVersion), so that value must not itself start with "0".
def appVersion = project.property('appVersion')
// Not DesktopApp itself - see Launcher's Javadoc for why a jpackage
// app-image (classpath-mode, no --module-path) needs this indirection.
def mainClassName = 'de.schliweb.moveapiece.desktop.Launcher'
// Fixed, generated once via `uuidgen` - never change this. jpackage's MSI
// bundler uses it as the product's upgrade code; a stable value is what
// lets Windows recognize a newer MSI as an upgrade of the same app
// (Add/Remove Programs) instead of installing a second, parallel copy. Left
// unpinned, jpackage generates a random one per build.
def WIN_UPGRADE_UUID = 'B7D289C7-B828-43F3-AAB5-392C2E796CB5'

def sourceIconPng = file("$projectDir/src/main/resources/de/schliweb/moveapiece/desktop/icon.png")
def iconsDir = layout.buildDirectory.dir('icons').get().asFile
def jpackageInputDir = layout.buildDirectory.dir('jpackage-input').get().asFile
def jpackageDestDir = layout.buildDirectory.dir('jpackage').get().asFile

def writeLE16 = { java.io.DataOutputStream dos, int v ->
    dos.write(v & 0xFF)
    dos.write((v >> 8) & 0xFF)
}
def writeLE32 = { java.io.DataOutputStream dos, int v ->
    dos.write(v & 0xFF)
    dos.write((v >> 8) & 0xFF)
    dos.write((v >> 16) & 0xFF)
    dos.write((v >> 24) & 0xFF)
}

// Windows .ico: a small header/directory followed by one PNG-encoded image
// per size (PNG-in-ICO has been valid since Windows Vista) - much simpler
// than writing raw BMP/DIB bitmaps, and needs no extra library beyond
// javax.imageio, which is already part of the JDK running this build.
def generateIco = { File destIco, List<Integer> sizes ->
    def source = javax.imageio.ImageIO.read(sourceIconPng)
    def entries = sizes.collect { size ->
        def scaled = new java.awt.image.BufferedImage(size, size, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def g = scaled.createGraphics()
        g.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                java.awt.RenderingHints.VALUE_INTERPOLATION_BILINEAR)
        g.drawImage(source, 0, 0, size, size, null)
        g.dispose()
        def baos = new java.io.ByteArrayOutputStream()
        javax.imageio.ImageIO.write(scaled, 'png', baos)
        [size: size, bytes: baos.toByteArray()]
    }
    destIco.parentFile.mkdirs()
    destIco.withOutputStream { rawOut ->
        def dos = new java.io.DataOutputStream(rawOut)
        writeLE16(dos, 0)
        writeLE16(dos, 1)
        writeLE16(dos, entries.size())
        int offset = 6 + entries.size() * 16
        entries.each { e ->
            int wh = e.size >= 256 ? 0 : e.size
            dos.write(wh)
            dos.write(wh)
            dos.write(0)
            dos.write(0)
            writeLE16(dos, 1)
            writeLE16(dos, 32)
            writeLE32(dos, e.bytes.length)
            writeLE32(dos, offset)
            offset += e.bytes.length
        }
        entries.each { e -> dos.write(e.bytes) }
    }
}

tasks.register('generateIcons') {
    inputs.file(sourceIconPng)
    def icnsFile = new File(iconsDir, 'icon.icns')
    def icoFile = new File(iconsDir, 'icon.ico')
    def pngFile = new File(iconsDir, 'icon.png')
    outputs.files(icnsFile, icoFile, pngFile)

    doLast {
        iconsDir.mkdirs()

        // Linux: jpackage just wants a single PNG.
        pngFile.bytes = sourceIconPng.bytes

        // Windows: PNG-in-ICO, see generateIco above.
        generateIco(icoFile, [16, 32, 48, 128, 256])

        // macOS: build a .iconset directory and hand it to `iconutil`
        // (only available on macOS - guarded so this build still
        // completes on other hosts, just without a .icns).
        if (os.isMacOsX()) {
            def iconset = new File(iconsDir, 'icon.iconset')
            iconset.mkdirs()
            def source = javax.imageio.ImageIO.read(sourceIconPng)
            // name -> pixel size, per Apple's documented iconset naming.
            def sizes = [
                'icon_16x16.png'      : 16,
                'icon_16x16@2x.png'   : 32,
                'icon_32x32.png'      : 32,
                'icon_32x32@2x.png'   : 64,
                'icon_128x128.png'    : 128,
                'icon_128x128@2x.png' : 256,
                'icon_256x256.png'    : 256,
                'icon_256x256@2x.png' : 512,
                'icon_512x512.png'    : 512,
            ]
            sizes.each { name, size ->
                def scaled = new java.awt.image.BufferedImage(size, size, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                def g = scaled.createGraphics()
                g.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                        java.awt.RenderingHints.VALUE_INTERPOLATION_BILINEAR)
                g.drawImage(source, 0, 0, size, size, null)
                g.dispose()
                javax.imageio.ImageIO.write(scaled, 'png', new File(iconset, name))
            }
            def pb = new ProcessBuilder(['iconutil', '-c', 'icns', '-o', icnsFile.absolutePath, iconset.absolutePath])
            pb.redirectErrorStream(true)
            Process proc = pb.start()
            proc.inputStream.eachLine { logger.lifecycle(it) }
            int exitCode = proc.waitFor()
            if (exitCode != 0) {
                throw new GradleException("iconutil failed (${exitCode}) building ${icnsFile}")
            }
        }
    }
}

tasks.register('prepareJpackageInput', Copy) {
    dependsOn tasks.named('jar'), tasks.named('buildStockfishHost')
    // Copy never removes files that are no longer part of its inputs, so a
    // jar left behind by a dependency version bump (e.g. the old
    // javafx-*-21.0.2-*.jar files after bumping to 24.0.2) would otherwise
    // sit next to the new one forever, putting two versions of the same
    // classes on jpackage's classpath.
    doFirst {
        delete jpackageInputDir
    }
    from tasks.named('jar')
    from configurations.runtimeClasspath
    // Bundle the host-built Stockfish binary + NNUE nets into the package
    // itself, at Contents/app/stockfish/ - StockfishLocator resolves them
    // there relative to its own jar at runtime. Without this, the app only
    // knew stockfishHome.properties' build-time absolute path, which only
    // exists on the machine that built the package (e.g. a CI runner's
    // ephemeral checkout), so an installed app silently had no engine.
    from(project.ext.stockfishOutDir) {
        into 'stockfish'
    }
    into jpackageInputDir
    // Copy doesn't reliably preserve the exec bit across all OSes/Gradle
    // versions, and a non-executable Stockfish binary fails the same way
    // as a missing one.
    doLast {
        new File(jpackageInputDir, "stockfish/${project.ext.stockfishExeName}").setExecutable(true, false)
    }
}

// The bundled runtime's module set. DesktopApp launches in classpath mode
// (see Launcher's Javadoc), so jpackage/jlink can't compute this itself by
// tracing module-info requires - without --add-modules it defaults to
// bundling the *entire* JDK (~150 MB). Computed via:
//   jdeps --multi-release <N> --ignore-missing-deps --print-module-deps \
//     --class-path <all jpackage-input jars> <all jpackage-input jars>
// against desktop.jar, core.jar, chesslib, commons-lang3 and the javafx-*
// jars together (jdeps only reports *JDK platform* module deps - the
// third-party jars themselves are simply bundled as-is, not part of the
// runtime image). Re-run that whenever a new JDK API or dependency is
// added and re-verify the app still works end-to-end (UI, engine moves,
// move sounds, file dialogs) with the trimmed runtime - jdeps only sees
// static bytecode references, not reflection/ServiceLoader-based ones.
def runtimeModules = ['java.base', 'java.desktop', 'jdk.jfr', 'jdk.unsupported']

def runJpackage = { String type ->
    jpackageDestDir.mkdirs()
    def icon
    if (os.isMacOsX()) {
        icon = new File(iconsDir, 'icon.icns')
    } else if (os.isWindows()) {
        icon = new File(iconsDir, 'icon.ico')
    } else {
        icon = new File(iconsDir, 'icon.png')
    }
    def mainJarName = tasks.named('jar').get().archiveFileName.get()
    def jpackageBin = new File(System.getProperty('java.home'), 'bin/jpackage').absolutePath
    def cmd = [
        jpackageBin,
        '--type', type,
        '--name', appName,
        '--app-version', appVersion,
        '--input', jpackageInputDir.absolutePath,
        '--main-jar', mainJarName,
        '--main-class', mainClassName,
        '--dest', jpackageDestDir.absolutePath,
        '--vendor', 'schliweb.de',
        '--add-modules', runtimeModules.join(','),
    ]
    if (icon.exists()) {
        cmd += ['--icon', icon.absolutePath]
    }
    if (type == 'deb') {
        cmd += ['--linux-shortcut']
    }
    if (type == 'msi') {
        cmd += [
                '--win-shortcut',
                '--win-menu',
                '--win-upgrade-uuid', WIN_UPGRADE_UUID,
                // TEMPORARY DIAGNOSTIC (see conversation/commit history): move
                // sounds are silent in the installed .msi with no error visible
                // anywhere - AudioClip.play() may be failing internally and
                // logging to stderr, invisible because a normal jpackage'd
                // Windows GUI app has no attached console. --win-console keeps
                // one open so stdout/stderr are actually visible. Remove once
                // the real cause is found.
                '--win-console',
        ]
    }
    def pb = new ProcessBuilder(cmd)
    pb.redirectErrorStream(true)
    Process proc = pb.start()
    proc.inputStream.eachLine { logger.lifecycle(it) }
    int exitCode = proc.waitFor()
    if (exitCode != 0) {
        throw new GradleException("jpackage --type ${type} failed (${exitCode})")
    }
    logger.lifecycle("${type} written to ${jpackageDestDir}")
}

tasks.register('jpackageAppImage') {
    dependsOn 'generateIcons', 'prepareJpackageInput'
    inputs.dir(jpackageInputDir)
    inputs.file(sourceIconPng)
    outputs.dir(jpackageDestDir)

    doLast {
        runJpackage('app-image')
    }
}

// See the file header for why macOS ships a DMG instead of the raw
// app-image: it's the only format that survives a CI-artifact round trip
// without breaking the app bundle's ad-hoc code signature.
tasks.register('jpackageDmg') {
    dependsOn 'generateIcons', 'prepareJpackageInput'
    inputs.dir(jpackageInputDir)
    inputs.file(sourceIconPng)
    outputs.dir(jpackageDestDir)

    doLast {
        if (!os.isMacOsX()) {
            throw new GradleException('jpackageDmg is only supported on macOS')
        }
        runJpackage('dmg')
    }
}

// See the file header for the Linux/Windows equivalents of the DMG note
// above: dpkg-deb/fakeroot and the WiX Toolset respectively must be on
// PATH.
tasks.register('jpackageDeb') {
    dependsOn 'generateIcons', 'prepareJpackageInput'
    inputs.dir(jpackageInputDir)
    inputs.file(sourceIconPng)
    outputs.dir(jpackageDestDir)

    doLast {
        if (!os.isLinux()) {
            throw new GradleException('jpackageDeb is only supported on Linux')
        }
        runJpackage('deb')
    }
}

tasks.register('jpackageMsi') {
    dependsOn 'generateIcons', 'prepareJpackageInput'
    inputs.dir(jpackageInputDir)
    inputs.file(sourceIconPng)
    outputs.dir(jpackageDestDir)

    doLast {
        if (!os.isWindows()) {
            throw new GradleException('jpackageMsi is only supported on Windows')
        }
        runJpackage('msi')
    }
}
