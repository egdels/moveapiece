/*
 * Compiles the Windows Runtime/JNI bridge
 * (src/main/native/windows/PegasusBleWin.cpp) into a DLL for
 * WindowsPegasusBleTransport - see that class's Javadoc and
 * PegasusBleWin.cpp's own header comment for the architecture and
 * threading model.
 *
 * Windows only, by design (see the physical board section of README.md):
 * macOS (CoreBluetooth) is already implemented, see pegasus-ble-macos.gradle;
 * Linux (pure-Java BlueZ D-Bus, no native code needed) is separate,
 * not-yet-implemented follow-up work. This script simply isn't applied on
 * other hosts (see the os.isWindows() guard below), and
 * WindowsPegasusBleTransport is never instantiated there either.
 *
 * Toolchain: MSVC + C++/WinRT (the Microsoft-documented way to consume
 * Windows Runtime APIs from a classic desktop app), not the MinGW/MSYS2
 * toolchain desktop/stockfish.gradle already uses on Windows - raw
 * WinRT/COM interop via MinGW is comparatively unsupported and fragile.
 * `cl.exe` and `cppwinrt.exe` are used from PATH when already there (a
 * "Developer Command Prompt for VS" locally, or the ilammy/msvc-dev-cmd
 * GitHub Action in CI - see .github/workflows/desktop.yml/release.yml's
 * Windows leg). When they are not - a build launched from an IDE or a
 * plain terminal - the script locates the newest Visual Studio (or Build
 * Tools) install with the C++ workload via vswhere.exe, captures the
 * environment its VsDevCmd.bat sets up for x64 and runs the tools with
 * that, mirroring what stockfish.gradle does for MSYS2.
 *
 * Driven directly with ProcessBuilder, same rationale as stockfish.gradle's
 * header comment (Gradle 9's task execution model disallows calling back
 * into the Project instance from inside doLast).
 */

def os = org.gradle.internal.os.OperatingSystem.current()

if (os.isWindows()) {
    def nativeSrcDir = file("$projectDir/src/main/native/windows")
    def nativeOutDir = layout.buildDirectory.dir('native').get().asFile
    def cppwinrtGenDir = layout.buildDirectory.dir('cppwinrt-gen').get().asFile
    def dllName = 'PegasusBleWin.dll'
    def dllFile = new File(nativeOutDir, dllName)
    def javaHome = System.getProperty('java.home')

    // Consumed by packaging.gradle, which bundles this DLL into the
    // jpackage image next to the app's own jar - see
    // PegasusBleWinLibrary's Javadoc for why that's needed.
    project.ext.pegasusBleWinDll = dllFile
    project.ext.pegasusBleWinDllName = dllName

    // MSVC toolchain lookup (see the header comment). The developer
    // environment is captured lazily, once per build, inside the first task
    // action that needs it - VsDevCmd.bat takes a couple of seconds, which
    // should not be paid at configuration time by builds that never touch
    // the native tasks.
    def findOnPath = { String name, String pathValue ->
        (pathValue ?: '').split(java.util.regex.Pattern.quote(File.pathSeparator))
            .collect { dir -> dir ? new File(dir, name + '.exe') : null }
            .find { it != null && it.isFile() }
    }
    def readProcessOutput = { List<String> cmd ->
        def pb = new ProcessBuilder(cmd)
        pb.redirectErrorStream(true)
        def proc = pb.start()
        def text = proc.inputStream.getText('UTF-8')
        if (proc.waitFor() != 0) {
            throw new GradleException("Command failed (${proc.exitValue()}): ${cmd.join(' ')}\n${text}")
        }
        text
    }
    def msvcEnvHolder = [null]
    def msvcEnv = { ->
        if (msvcEnvHolder[0] != null) {
            return msvcEnvHolder[0]
        }
        def parentPath = System.getenv('PATH')
        if (findOnPath('cl', parentPath) && findOnPath('cppwinrt', parentPath)) {
            msvcEnvHolder[0] = [:]
            return msvcEnvHolder[0]
        }
        def hint = "cl.exe/cppwinrt.exe are not on PATH. Run the build from a 'Developer Command Prompt for VS', " +
            "or install Visual Studio / Build Tools 2022 with the 'Desktop development with C++' workload " +
            "(including a Windows 10/11 SDK) so the build can locate it via vswhere.exe."
        def vswhere = new File(System.getenv('ProgramFiles(x86)') ?: 'C:\\Program Files (x86)',
            'Microsoft Visual Studio/Installer/vswhere.exe')
        if (!vswhere.isFile()) {
            throw new GradleException("${hint} (${vswhere} does not exist)")
        }
        def vsRoot = readProcessOutput([vswhere.absolutePath, '-latest', '-products', '*',
            '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
            '-property', 'installationPath']).trim()
        def devCmd = vsRoot ? new File(vsRoot, 'Common7/Tools/VsDevCmd.bat') : null
        if (devCmd == null || !devCmd.isFile()) {
            throw new GradleException("${hint} (vswhere found no install with the C++ tools)")
        }
        logger.lifecycle("Using MSVC toolchain from ${vsRoot}")
        // `set` prints KEY=VALUE lines (in UTF-8 thanks to the chcp, instead
        // of the console's OEM code page); the batch file's own banner is
        // suppressed with -no_logo. Split at the first '=' only - values
        // (PATH entries, INCLUDE, ...) can contain '=' themselves.
        def dump = readProcessOutput(['cmd.exe', '/d', '/c',
            "chcp 65001 >nul && call \"${devCmd.absolutePath}\" -no_logo -arch=x64 -host_arch=x64 && set".toString()])
        def env = [:]
        dump.readLines().each { line ->
            int eq = line.indexOf('=')
            if (eq > 0) {
                env.put(line.substring(0, eq), line.substring(eq + 1))
            }
        }
        if (!findOnPath('cl', env['Path'] ?: env['PATH']) || !findOnPath('cppwinrt', env['Path'] ?: env['PATH'])) {
            throw new GradleException("${hint} (VsDevCmd.bat from ${vsRoot} did not put cl.exe and cppwinrt.exe on PATH)")
        }
        msvcEnvHolder[0] = env
        env
    }

    def runTool = { List<String> cmd, File workDir ->
        def env = msvcEnv()
        def exe = cmd[0].toString()
        if (env) {
            // CreateProcess resolves a bare program name against the parent
            // process's PATH, not the child environment set below, so use the
            // absolute path from the captured environment.
            exe = findOnPath(exe, env['Path'] ?: env['PATH']).absolutePath
        }
        def pb = new ProcessBuilder(([exe] + cmd.drop(1)).collect { it.toString() })
        pb.directory(workDir)
        // Replace the whole inherited environment with the captured one. The
        // Gradle daemon can hand ProcessBuilder both "Path" and "PATH" keys
        // (its case-insensitive map gets replaced when the daemon adopts the
        // client's environment), so a per-key put() could leave a stale
        // duplicate behind that the child then reads instead.
        if (env) {
            pb.environment().clear()
            pb.environment().putAll(env)
        }
        pb.redirectErrorStream(true)
        Process proc = pb.start()
        proc.inputStream.eachLine { logger.lifecycle(it) }
        int exitCode = proc.waitFor()
        if (exitCode != 0) {
            throw new GradleException("Command failed (${exitCode}): ${cmd.join(' ')}")
        }
    }

    // Generates the C++/WinRT projection headers (winrt/Windows.*.h) from
    // the Windows SDK's metadata - the header-only C++/WinRT library isn't
    // pre-generated in the SDK itself, unlike jni.h; a real Visual Studio
    // project would pull this in automatically via the
    // Microsoft.Windows.CppWinRT NuGet package's MSBuild target, which a
    // plain cl.exe invocation (no .vcxproj here) doesn't have, so it's
    // generated explicitly instead.
    tasks.register('generateCppWinrtHeaders') {
        outputs.dir(cppwinrtGenDir)
        doLast {
            cppwinrtGenDir.mkdirs()
            runTool(['cppwinrt', '-input', 'sdk', '-output', cppwinrtGenDir.absolutePath], projectDir)
        }
    }

    tasks.register('compilePegasusBleWin') {
        dependsOn 'generateCppWinrtHeaders'
        inputs.dir(nativeSrcDir)
        inputs.property('javaHome', javaHome)
        outputs.file(dllFile)

        doLast {
            nativeOutDir.mkdirs()
            def cmd = [
                'cl',
                '/nologo',
                '/std:c++20',
                '/EHsc',
                '/utf-8',
                // Static CRT: jpackage already bundles a full JRE so the app
                // needs nothing else installed to run - dynamically linking
                // the MSVC runtime (cl's default for /LD) would silently
                // require the Visual C++ Redistributable on the target
                // machine too.
                '/MT',
                '/I', "${javaHome}\\include",
                '/I', "${javaHome}\\include\\win32",
                '/I', cppwinrtGenDir.absolutePath,
                '/LD',
                new File(nativeSrcDir, 'PegasusBleWin.cpp').absolutePath,
                "/Fe:${dllFile.absolutePath}".toString(),
                '/link', 'WindowsApp.lib',
            ]
            runTool(cmd, nativeOutDir)
        }
    }

    // Exposed to WindowsPegasusBleTransport via a generated properties
    // file, mirroring stockfish.gradle/pegasus-ble-macos.gradle's own
    // writeXxxHomeProperties tasks - see PegasusBleWinLibrary's Javadoc for
    // the two lookup locations (packaged vs. :desktop:run).
    def pegasusBleWinHomeProps =
            layout.buildDirectory.file('generated-pegasus-ble/pegasusBleWinHome.properties').get().asFile
    tasks.register('writePegasusBleWinHomeProperties') {
        dependsOn 'compilePegasusBleWin'
        outputs.file(pegasusBleWinHomeProps)
        doLast {
            pegasusBleWinHomeProps.parentFile.mkdirs()
            // Backslash is the escape character in .properties files, so a
            // raw Windows path would lose its separators in Properties.load
            // (and "\native" would even turn into a newline + "ative").
            def escaped = nativeOutDir.absolutePath.replace('\\', '\\\\')
            pegasusBleWinHomeProps.text =
                    "pegasusBleWin.home=${escaped}\npegasusBleWin.lib=${dllName}\n"
        }
    }

    sourceSets.main.resources.srcDirs += pegasusBleWinHomeProps.parentFile

    tasks.matching { it.name == 'processResources' }.configureEach {
        dependsOn 'writePegasusBleWinHomeProperties'
    }
}
