# google-java-format (used by Spotless) reaches into javac internals and
# needs these opened up on JDK 16+, or the Gradle daemon fails with
# InaccessibleObjectException when running spotlessCheck/spotlessApply.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 \
  --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
  --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
  --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
android.useAndroidX=true
android.nonTransitiveRClass=true
# Reproducible builds: pin toolchain versions explicitly in app/build.gradle,
# never use version ranges ('+') for dependencies.

# Single source of truth for the user-facing version shown by both the
# Android app (versionName, app/build.gradle) and the desktop app
# (jpackage --app-version, desktop/packaging.gradle). Must be one to three
# dot-separated integers with a positive (non-zero) leading component -
# jpackage's macOS bundler rejects anything else (e.g. "0.1.0") outright.
appVersion=1.0.0
